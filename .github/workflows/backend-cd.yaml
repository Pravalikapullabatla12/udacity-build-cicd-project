name: Backend CD

on:
push:
branches:
- main
paths:
- 'starter/backend/**'
workflow_dispatch:

env:
AWS_REGION: ${{ secrets.AWS_REGION }}

jobs:
lint:
name: Backend Lint
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Install Pipenv
    run: pip install pipenv

  - name: Install dependencies
    working-directory: starter/backend
    run: pipenv install

  - name: Run lint
    working-directory: starter/backend
    run: pipenv run lint
```

test:
name: Backend Tests
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.10'

  - name: Install Pipenv
    run: pip install pipenv

  - name: Install dependencies
    working-directory: starter/backend
    run: pipenv install

  - name: Run tests
    working-directory: starter/backend
    run: pipenv run test
```

build:
name: Build and Push Backend Image
runs-on: ubuntu-latest
needs:
- lint
- test

```
outputs:
  image_tag: ${{ steps.image.outputs.image_tag }}

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Login to Amazon ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2

  - name: Build backend Docker image
    working-directory: starter/backend
    env:
      ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      ECR_REPOSITORY: ${{ secrets.ECR_BACKEND_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
    run: |
      docker build \
        --tag ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} \
        .

  - name: Push backend image to ECR
    working-directory: starter/backend
    env:
      ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      ECR_REPOSITORY: ${{ secrets.ECR_BACKEND_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
    run: |
      docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

  - name: Set image output
    id: image
    env:
      IMAGE_TAG: ${{ github.sha }}
    run: echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
```

deploy:
name: Deploy Backend to Kubernetes
runs-on: ubuntu-latest
needs: build

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Update kubeconfig
    run: |
      aws eks update-kubeconfig \
        --name cluster \
        --region ${AWS_REGION}

  - name: Install Kustomize
    run: |
      curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
      sudo mv kustomize /usr/local/bin/kustomize

  - name: Set backend image
    working-directory: starter/backend/k8s
    env:
      ECR_REPOSITORY: ${{ secrets.ECR_BACKEND_REPOSITORY }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    run: |
      ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
      kustomize edit set image backend=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

  - name: Deploy backend manifests
    working-directory: starter/backend/k8s
    run: |
      kustomize build | kubectl apply -f -

  - name: Verify backend deployment
    run: |
      kubectl rollout status deployment/backend
```
