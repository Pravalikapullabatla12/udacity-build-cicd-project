name: Frontend CD

on:
push:
branches:
- main
paths:
- 'starter/frontend/**'
workflow_dispatch:

env:
AWS_REGION: ${{ secrets.AWS_REGION }}
REACT_APP_MOVIE_API_URL: http://localhost:5000

jobs:
lint:
name: Frontend Lint
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version-file: 'starter/frontend/.nvmrc'
      cache: npm
      cache-dependency-path: starter/frontend/package-lock.json

  - name: Install dependencies
    working-directory: starter/frontend
    run: npm ci

  - name: Run ESLint
    working-directory: starter/frontend
    run: npm run lint
```

test:
name: Frontend Tests
runs-on: ubuntu-latest

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version-file: 'starter/frontend/.nvmrc'
      cache: npm
      cache-dependency-path: starter/frontend/package-lock.json

  - name: Install dependencies
    working-directory: starter/frontend
    run: npm ci

  - name: Run tests
    working-directory: starter/frontend
    run: CI=true npm test -- --watchAll=false
```

build:
name: Build and Push Frontend Image
runs-on: ubuntu-latest
needs:
- lint
- test

```
outputs:
  image_tag: ${{ steps.image.outputs.image_tag }}

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Login to Amazon ECR
    id: login-ecr
    uses: aws-actions/amazon-ecr-login@v2

  - name: Build frontend Docker image
    working-directory: starter/frontend
    env:
      ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      ECR_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
    run: |
      docker build \
        --build-arg REACT_APP_MOVIE_API_URL=${REACT_APP_MOVIE_API_URL} \
        --tag ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG} \
        .

  - name: Push frontend image to ECR
    working-directory: starter/frontend
    env:
      ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
      ECR_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}
      IMAGE_TAG: ${{ github.sha }}
    run: |
      docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

  - name: Set image output
    id: image
    env:
      IMAGE_TAG: ${{ github.sha }}
    run: echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
```

deploy:
name: Deploy Frontend to Kubernetes
runs-on: ubuntu-latest
needs: build

```
steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Configure AWS credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  - name: Update kubeconfig
    run: |
      aws eks update-kubeconfig \
        --name cluster \
        --region ${AWS_REGION}

  - name: Install Kustomize
    run: |
      curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
      sudo mv kustomize /usr/local/bin/kustomize

  - name: Set frontend image
    working-directory: starter/frontend/k8s
    env:
      ECR_REPOSITORY: ${{ secrets.ECR_FRONTEND_REPOSITORY }}
      IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
    run: |
      ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      ECR_REGISTRY=${ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com
      kustomize edit set image frontend=${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}

  - name: Deploy frontend manifests
    working-directory: starter/frontend/k8s
    run: |
      kustomize build | kubectl apply -f -

  - name: Verify frontend deployment
    run: |
      kubectl rollout status deployment/frontend
```
